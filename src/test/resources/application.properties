# In-Memory Database Configuration for Automated Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Test Environment
# create-drop so H2 can be re-shaped per test; we don't run Flyway here because
# the H2 dialect emits the same DDL we already pin in V1.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Tests need a known-strength JWT secret (the prod default is rejected as too weak by validation).
app.jwt.secret=test-secret-test-secret-test-secret-test-secret-32b!
app.jwt.issuer=attendance-tracker-test
app.jwt.ttl-seconds=900
