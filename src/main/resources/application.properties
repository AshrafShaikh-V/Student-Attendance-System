# Application Name
spring.application.name=attendance-tracker

# Server Configuration
server.port=8080
server.compression.enabled=true

# MySQL Database Configuration
# Set DB_URL / DB_USERNAME / DB_PASSWORD as environment variables in production.
# Example: DB_URL=jdbc:mysql://prod-host:3306/student_attendance?serverTimezone=UTC&useSSL=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_attendance?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# Production: validate (JPA checks entities match the Flyway-managed schema; it does NOT alter).
# Dev/test: switch to "create-drop" or "update" in the active profile.
spring.jpa.hibernate.ddl-auto=validate
# SQL logging is OFF in production; enable it in application-dev.properties
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
# Override JWT_SECRET in production; must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-please-32b+}
app.jwt.issuer=${JWT_ISSUER:attendance-tracker}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}

# Rate limiting (per IP, requests per minute)
app.ratelimit.requests-per-minute=${RATE_LIMIT_RPM:60}

# Optional: bootstrap an admin on first run
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# Spring profile (set to "dev" or "prod" via SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.access=unauthorized

# Springdoc / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
