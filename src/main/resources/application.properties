# Application Name
spring.application.name=attendance-tracker

# Server Configuration
server.port=8080

# MySQL Database Configuration
# Set DB_URL / DB_USERNAME / DB_PASSWORD as environment variables in production.
# Example: DB_URL=jdbc:mysql://prod-host:3306/student_attendance?serverTimezone=UTC&useSSL=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_attendance?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# SQL logging is OFF in production; enable it in application-dev.properties
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
