services:
  mysql:
    image: mysql:8.4
    container_name: attendance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_attendance
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: attendance_user
      MYSQL_PASSWORD: attendance_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-tracker-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/student_attendance?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: attendance_user
      DB_PASSWORD: attendance_pass
      DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JPA_HIBERNATE_DDL_AUTO: validate
      HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      FLYWAY_ENABLED: "true"
      JWT_SECRET: change-me-change-me-change-me-change-me-please-32b+
      JWT_ISSUER: attendance-tracker
      JWT_TTL_SECONDS: "900"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
