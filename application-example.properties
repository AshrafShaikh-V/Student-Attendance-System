# Copy this file to application-local.properties or use it as a reference for environment variables.
# Never commit real secrets into source control.

server.port=8080

# MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/student_attendance?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT configuration
app.jwt.secret=replace-with-a-long-random-secret-at-least-32-characters
app.jwt.issuer=attendance-tracker
app.jwt.ttl-seconds=900

# Optional admin bootstrap values
app.bootstrap.admin-email=admin@attendance.local
app.bootstrap.admin-password=ChangeThisPassword123!

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
